[package]
name = "devshelltools-studio"
version = "1.0.5"
description = "DevShellTools 便携管理工具"
authors = ["DevShellTools"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "devshelltools_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.8.5", features = [] }
tauri-plugin-fs = "=2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
chrono = "0.4"

# M1 阶段使用标准库 + 系统 git，避免引入未缓存 crate。
# M3 再加入：reqwest、keyring、eventsource-stream
# M4 再加入：zip

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
